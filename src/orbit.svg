<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" aria-hidden="true">
<style>
@keyframes twinkle { from { opacity: 1 } to { opacity: .2 } }
@keyframes drift { from { transform: translate(-14px, 0) } to { transform: translate(14px, -6px) } }
@media (prefers-reduced-motion: no-preference) {
  .tw0 { animation: twinkle 2.6s ease-in-out infinite alternate }
  .tw1 { animation: twinkle 3.4s ease-in-out .8s infinite alternate }
  .tw2 { animation: twinkle 4.3s ease-in-out 1.6s infinite alternate }
  .tw3 { animation: twinkle 5.6s ease-in-out .4s infinite alternate }
  .drift0 { animation: drift 38s ease-in-out infinite alternate }
  .drift1 { animation: drift 26s ease-in-out infinite alternate-reverse }
}

@keyframes orbit { to { transform: rotate(360deg) } }
@keyframes float { from { transform: translateY(-4px) } to { transform: translateY(4px) } }
@media (prefers-reduced-motion: no-preference) {
  .orb { animation: orbit var(--d) linear infinite }
  .planet { animation: float 5s ease-in-out infinite alternate }
}
</style>
