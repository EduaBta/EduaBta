<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" aria-hidden="true">
<style>
@keyframes fly { 0% { transform: translateX(0); opacity: 0 } 8% { opacity: 1 } 92% { opacity: 1 } 100% { transform: translateX(1360px); opacity: 0 } }
.comet { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .comet { animation: fly 6s ease-in-out infinite } }
</style>
<defs>
  <linearGradient id="ln" x1="0" x2="1">
    <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/><stop offset=".2" stop-color="#00F7FF" stop-opacity=".7"/>
    <stop offset=".5" stop-color="#C77DFF"/><stop offset=".8" stop-color="#FF7AD9" stop-opacity=".7"/><stop offset="1" stop-color="#FF7AD9" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tail" x1="0" x2="1"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#FFF"/></linearGradient>
  <filter id="g" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="0" y="11.0" width="1200" height="2" fill="url(#ln)"/>
<rect x="0" y="9.0" width="1200" height="6" fill="url(#ln)" opacity=".35" filter="url(#g)"/>
<g class="comet"><g transform="translate(-160 0)">
  <rect x="0" y="10.5" width="150" height="3" rx="1.5" fill="url(#tail)"/>
  <circle cx="150" cy="12.0" r="7" fill="#FFF" opacity=".25" filter="url(#g)"/><circle cx="150" cy="12.0" r="3" fill="#FFF"/>
</g></g>
</svg>
